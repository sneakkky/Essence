<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essence — Cotton jersey T-shirt</title>
    <link rel="stylesheet" href="main.css">
    <script src="cart.js"></script>
</head>
<body>

<header class="top-black-bar">
    <a href="main.html" class="essence-logo">Essence</a>
    <div class="nav-buttons">
        <a href="men.html" class="nav-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            мужское
        </a>
        <a href="women.html" class="nav-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            женское
        </a>
        <a href="cart.html" class="nav-btn" id="cartBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="20" r="1.5"/>
                <circle cx="18" cy="20" r="1.5"/>
                <path d="M2 2h4l2.7 12.4a2 2 0 0 0 2 1.6h7.3a2 2 0 0 0 2-1.6L22 6H6"/>
            </svg>
            корзина
        </a>
        <a href="register.html" class="register-btn-red">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            регистрация
        </a>
    </div>
</header>

<div class="product-detail-section">
    <div class="product-detail-container">
        <div class="product-detail-image">
            <img src="Photo/27.jpg" alt="Cotton jersey T-shirt">
        </div>
        <div class="product-detail-info">
            <h1 class="product-detail-title">Cotton jersey T-shirt</h1>
            <div class="product-detail-price">€750</div>
            
            <div class="size-selector">
                <select id="sizeSelect" class="size-dropdown">
                    <option value="" disabled selected>Выберите размер</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                </select>
            </div>
            
            <button class="add-to-cart-btn" onclick="addProductToCart()">ДОБАВИТЬ В КОРЗИНУ</button>
            
            <div class="product-detail-description">
                <p>Модель из коллекции Maison Margiela. Изготовлено из высококачественных материалов.</p>
            </div>
        </div>
    </div>
</div>

<footer class="footer-black-bar">
    <div class="footer-site-name">Essence</div>
    <div class="footer-nav">
        <button class="footer-link" onclick="alert('Регистрация')">регистрация</button>
        <a href="men.html" class="footer-link">мужское</a>
        <a href="women.html" class="footer-link">женское</a>
    </div>
</footer>

<script>
    function addProductToCart() {
        let size = document.getElementById('sizeSelect').value;
        if (!size) {
            alert('Выберите размер');
            return;
        }
        addToCart('Cotton jersey T-shirt', '€750', size);
        document.getElementById('sizeSelect').value = "";
    }
</script>

</body>
</html>
