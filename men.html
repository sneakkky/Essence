<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мужская линейка</title>
    <link rel="stylesheet" href="main.css">
    <script src="loaddata.js"></script>
</head>
<body>

<header class="top-black-bar">
    <a href="main.html" class="essence-logo">Essence</a>
    <div class="nav-buttons">
        <a href="men.html" class="nav-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            мужское
        </a>
        <a href="women.html" class="nav-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            женское
        </a>
        <a href="cart.html" class="nav-btn" id="cartBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="20" r="1.5"/>
                <circle cx="18" cy="20" r="1.5"/>
                <path d="M2 2h4l2.7 12.4a2 2 0 0 0 2 1.6h7.3a2 2 0 0 0 2-1.6L22 6H6"/>
            </svg>
            корзина
        </a>
        <a href="register.html" class="register-btn-red">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            регистрация
        </a>
    </div>
</header>

<div class="products-section">
    <div class="cards-container" id="productsContainer">
        <div>Загрузка...</div>
    </div>
</div>

<footer class="footer-black-bar">
    <div class="footer-site-name">Essence</div>
</footer>

<script>
    loadData();
    
    setTimeout(() => {
        let menProducts = getProducts('men');
        let container = document.getElementById('productsContainer');
        container.innerHTML = '';
        
        menProducts.forEach(p => {
            container.innerHTML += `
                <a href="product${p.id}.html" class="product-card-link">
                    <div class="product-card">
                        <img class="product-img" src="${p.image}" alt="${p.name}">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">BYN${p.price}</div>
                    </div>
                </a>
            `;
        });
    }, 100);
</script>

</body>
</html>
